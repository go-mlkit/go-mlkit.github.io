baseURL = 'https://go-mlkit.github.io/'
locale  = 'en-us'
title   = 'go-mlkit'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-mlkit: machine learning in pure Go (CGO=0), planned for wave 3 of the go-scikit roadmap. Clustering, classification and model selection: k-means, DBSCAN, Gaussian mixtures, trees and forests, SVM, cross-validation, validated against scikit-learn."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "mlkit"
  kind  = "planned (wave 3)"
  href  = "https://go-mlkit.github.io/docs/latest/mlkit/"
  blurb = "Planned (wave 3). Clustering (k-means, DBSCAN, Gaussian mixtures), classification (SVM, trees, forests, boosting) and model selection (cross-validation), validated against scikit-learn. Repository layout not fixed."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-mlkit.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope, the plan and the references of each planned library. <a href=\"https://github.com/go-mlkit/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-mlkit/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the roadmap's bibliography for this domain: a plan, not a result.
[[params.checks]]
  name = "Clustering and classification"
  what = "With a shared initialisation and seed, partitions must match scikit-learn exactly (adjusted Rand index equal to 1); otherwise accuracy within cross-validation noise."
[[params.checks]]
  name = "Reference corpora"
  what = "Datasets from the UCI Machine Learning Repository (iris, wine, digits and others), downloaded on demand with their per-dataset licences checked, not vendored."
[[params.checks]]
  name = "Oracle harness"
  what = "scikit-learn is run from Go with JSON on a pipe; the unit suite passes with no oracle installed."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.25:1, bright on the dark background 12.78:1.
  base = "#7a5c00"
  deep = "#4a3800"
  bright = "#f0d060"
  shadow = "rgba(122,92,0,.7)"
  glow = "rgba(122,92,0,.6)"
  wash = "rgba(122,92,0,.10)"
  washDeep = "rgba(74,56,0,.06)"
  chipBg = "#fdf9ec"
  chipBorder = "#faf1cf"
  chipFg = "#4a3800"
  chipBgDark = "rgba(240,208,96,.14)"
  chipBorderDark = "rgba(240,208,96,.32)"
  chipFgDark = "#f7e5a8"
  statsEnd = "#fbf4d9"
  bandText = "#fdf7e6"
